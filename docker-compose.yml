services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: gzzang
      POSTGRES_PASSWORD: zz123123
      POSTGRES_DB: rail_domain_core
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.6-alpine
    ports:
      - "6379:6379"

  migrator:
    build:
      context: .
      dockerfile: app/RailDomainCore.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=rail_domain_core;Username=gzzang;Password=zz123123
    depends_on:
      - postgres

  blazor:
    build:
      context: .
      dockerfile: src/RailDomainCore.Blazor/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=rail_domain_core;Username=gzzang;Password=zz123123
      Redis__Configuration: redis:6379
    depends_on:
      - postgres
      - redis
      - migrator
    ports:
      - "8080:8080"

volumes:
  postgres-data:
